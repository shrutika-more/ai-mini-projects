<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>FOX AI Translate</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet">

    <style>
        :root {
            --fox-blue: #1683ff;
            --fox-cyan: #00d9ff;
            --dark: #07111f;
            --card: rgba(12, 28, 49, .82);
            --text: #eef7ff;
            --muted: #8fa8c2;
        }

        * {
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            margin: 0;
            color: var(--text);
            font-family: "Inter", Arial, sans-serif;
            background:
                radial-gradient(circle at 15% 15%, rgba(0, 140, 255, .18), transparent 30%),
                radial-gradient(circle at 85% 80%, rgba(0, 220, 255, .12), transparent 28%),
                linear-gradient(135deg, #040b15, #081a2f 55%, #06101e);
            overflow-x: hidden;
        }

        /* Abstract background */
        body::before {
            content: "";
            position: fixed;
            width: 320px;
            height: 320px;
            border-radius: 50%;
            background: rgba(0, 136, 255, .08);
            filter: blur(60px);
            top: -100px;
            right: -80px;
            z-index: -1;
        }

        body::after {
            content: "";
            position: fixed;
            width: 260px;
            height: 260px;
            border-radius: 50%;
            background: rgba(0, 220, 255, .06);
            filter: blur(70px);
            bottom: -80px;
            left: -60px;
            z-index: -1;
        }

        .app-container {
            max-width: 720px;
            margin: auto;
            padding: 35px 15px 50px;
        }

        /* Brand */
        .brand {
            text-align: center;
            margin-bottom: 22px;
        }

        .brand-icon {
            width: 270px;
            height: 210px;
            margin: auto;
            border-radius: 24px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 42px;
            background: linear-gradient(145deg, #1683ff, #06458e);
            box-shadow:
                0 0 25px rgba(22, 131, 255, .35),
                inset 0 0 20px rgba(255, 255, 255, .12);
            animation: foxFloat 3s ease-in-out infinite;
        }

        @keyframes foxFloat {
            0%, 100% {
                transform: translateY(0);
            }

            50% {
                transform: translateY(-7px);
            }
        }

        .brand h1 {
            font-size: 27px;
            font-weight: 800;
            margin: 13px 0 4px;
            letter-spacing: -.5px;
        }

        .brand h1 span {
            color: var(--fox-cyan);
        }

        .brand p {
            color: var(--muted);
            margin: 0;
            font-size: 14px;
        }

        /* Main card */
        .translator-card {
            padding: 25px;
            border: 1px solid rgba(255, 255, 255, .08);
            border-radius: 24px;
            background: var(--card);
            backdrop-filter: blur(18px);
            -webkit-backdrop-filter: blur(18px);
            box-shadow: 0 25px 70px rgba(0, 0, 0, .35);
        }

        .language-row {
            display: flex;
            gap: 12px;
            align-items: end;
        }

        .language-box {
            flex: 1;
        }

        .form-label {
            color: #a9c4de;
            font-size: 13px;
            font-weight: 600;
            margin-bottom: 7px;
        }

        .form-select,
        .form-control {
            color: white;
            background-color: rgba(5, 18, 33, .9);
            border: 1px solid rgba(115, 175, 230, .18);
            border-radius: 13px;
        }

        .form-select {
            height: 48px;
        }

        .form-control {
            resize: vertical;
        }

        .form-select:focus,
        .form-control:focus {
            color: white;
            background-color: rgba(5, 18, 33, .95);
            border-color: var(--fox-blue);
            box-shadow: 0 0 0 .2rem rgba(22, 131, 255, .12);
        }

        textarea {
            min-height: 180px;
        }

        .swap-btn {
            width: 43px;
            height: 43px;
            flex: 0 0 43px;
            border-radius: 50%;
            border: 1px solid rgba(0, 217, 255, .25);
            color: var(--fox-cyan);
            background: rgba(0, 130, 255, .08);
            margin-bottom: 2px;
            transition: .25s;
        }

        .swap-btn:hover {
            background: rgba(0, 150, 255, .2);
            transform: rotate(180deg);
        }

        .text-header {
            display: flex;
            justify-content: space-between;
            margin-top: 20px;
        }

        #counter {
            color: #6f8ba5;
            font-size: 12px;
        }

        .translate-btn {
            width: 100%;
            margin-top: 18px;
            height: 52px;
            border: 0;
            border-radius: 14px;
            color: white;
            font-weight: 700;
            font-size: 15px;
            background: linear-gradient(100deg, #0969d7, #00a9e8);
            box-shadow: 0 10px 25px rgba(0, 130, 255, .22);
            transition: .25s;
        }

        .translate-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 14px 30px rgba(0, 150, 255, .35);
        }

        .footer-text {
            text-align: center;
            color: #607992;
            font-size: 12px;
            margin-top: 18px;
        }

        @media(max-width: 500px) {

            .app-container {
                padding-top: 25px;
            }

            .translator-card {
                padding: 18px;
                border-radius: 20px;
            }

            .language-row {
                gap: 7px;
            }

            .brand-icon {
                width: 250px;
                height: 250px;
                font-size: 34px;
            }

            .brand h1 {
                font-size: 24px;
            }
        }
    </style>
</head>

<body>

<div class="app-container">

    <!-- BRAND -->
    <div class="brand">

        <!-- Replace this emoji with your FOX animated image later -->
        <div class="brand-icon">
            <img src="{{ url_for('static', filename='new.jpg') }}" alt="FOX AI" style="width:90%">
        </div>

        <h1><span>AI Translate</span></h1>

        <p>Translate your words. Connect your world.</p>
    </div>


    <!-- TRANSLATOR -->
    <div class="translator-card">

        <form action="/translate" method="POST">

            <div class="language-row">

                <div class="language-box">

                    <label class="form-label">
                        From
                    </label>

                    <select name="source"
                            id="source"
                            class="form-select">

                        <option value="English">English</option>
                        <option value="Hindi">Hindi</option>
                        <option value="Marathi">Marathi</option>

                    </select>

                </div>


                <button type="button"
                        class="swap-btn"
                        onclick="swapLanguages()"
                        title="Swap languages">

                    ⇄

                </button>


                <div class="language-box">

                    <label class="form-label">
                        Translate to
                    </label>

                    <select name="target"
                            id="target"
                            class="form-select">

                        <option value="Marathi">Marathi</option>
                        <option value="Hindi">Hindi</option>
                        <option value="English">English</option>

                    </select>

                </div>

            </div>


            <div class="text-header">

                <label class="form-label">
                    Enter your text
                </label>

                <span id="counter">
                    0 characters
                </span>

            </div>


            <textarea
                name="text"
                id="text"
                class="form-control"
                placeholder="Type or paste your text here..."
                required></textarea>


            <button type="submit"
                    class="translate-btn">

                ✨ Translate with  AI

            </button>

        </form>

    </div>


    <div class="footer-text">
         New College,Kolhapur
    </div>

</div>


<script>

    const textarea = document.getElementById("text");
    const counter = document.getElementById("counter");

    textarea.addEventListener("input", function () {

        counter.textContent =
            this.value.length + " characters";

    });


    function swapLanguages() {

        const source = document.getElementById("source");
        const target = document.getElementById("target");

        const oldSource = source.value;

        source.value = target.value;
        target.value = oldSource;

    }

</script>

</body>

</html>
