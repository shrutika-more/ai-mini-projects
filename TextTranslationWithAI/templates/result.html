<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>FOX AI Translate - Result</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">


    <style>

        :root {
            --fox-blue: #1683ff;
            --fox-cyan: #00d9ff;
            --dark: #07111f;
            --card: rgba(12, 28, 49, .82);
            --text: #eef7ff;
            --muted: #8fa8c2;
        }


        * {
            box-sizing: border-box;
        }


        body {

            min-height: 100vh;

            margin: 0;

            color: var(--text);

            font-family: "Inter", Arial, sans-serif;

            background:
                radial-gradient(
                    circle at 15% 15%,
                    rgba(0, 140, 255, .18),
                    transparent 30%
                ),
                radial-gradient(
                    circle at 85% 80%,
                    rgba(0, 220, 255, .12),
                    transparent 28%
                ),
                linear-gradient(
                    135deg,
                    #040b15,
                    #081a2f 55%,
                    #06101e
                );

            overflow-x: hidden;
        }


        .app-container {

            max-width: 720px;

            margin: auto;

            padding: 35px 15px 50px;
        }


        /* BRAND */

        .brand {

            text-align: center;

            margin-bottom: 22px;
        }


        .brand-icon {

            width: 270px;
            height: 210px;

            margin: auto;

            border-radius: 23px;

            display: flex;

            align-items: center;

            justify-content: center;

            font-size: 38px;

            background:
                linear-gradient(
                    145deg,
                    #1683ff,
                    #06458e
                );

            box-shadow:
                0 0 25px rgba(22, 131, 255, .35),
                inset 0 0 20px rgba(255, 255, 255, .12);

            animation: floatFox 3s ease-in-out infinite;
        }


        @keyframes floatFox {

            0%, 100% {
                transform: translateY(0);
            }

            50% {
                transform: translateY(-6px);
            }

        }


        .brand h1 {

            font-size: 26px;

            font-weight: 800;

            margin: 12px 0 4px;
        }


        .brand h1 span {

            color: var(--fox-cyan);
        }


        .brand p {

            color: var(--muted);

            font-size: 13px;

            margin: 0;
        }


        /* RESULT CARD */

        .result-card {

            padding: 24px;

            border-radius: 24px;

            background: var(--card);

            border: 1px solid rgba(255,255,255,.08);

            backdrop-filter: blur(18px);

            box-shadow:
                0 25px 70px rgba(0,0,0,.35);
        }


        .result-title {

            display: flex;

            justify-content: space-between;

            align-items: center;

            margin-bottom: 18px;
        }


        .result-title h2 {

            font-size: 19px;

            margin: 0;

            font-weight: 700;
        }


        .badge-ai {

            padding: 6px 11px;

            border-radius: 20px;

            color: #bdefff;

            background: rgba(0,170,255,.1);

            border: 1px solid rgba(0,200,255,.2);

            font-size: 11px;
        }


        .language-label {

            color: #78baff;

            font-size: 12px;

            font-weight: 600;

            margin-bottom: 7px;

            text-transform: uppercase;

            letter-spacing: .6px;
        }


        .text-box {

            padding: 17px;

            border-radius: 15px;

            background: rgba(3,13,25,.75);

            border: 1px solid rgba(255,255,255,.07);

            color: #d9e9f7;

            line-height: 1.7;

            white-space: pre-wrap;

            word-break: break-word;

        }


        .original-box {

            margin-bottom: 20px;

            color: #94a9bd;
        }


        .translated-box {

            border-color: rgba(0,185,255,.2);

            box-shadow:
                inset 0 0 25px rgba(0,130,255,.035);
        }


        .actions {

            display: flex;

            gap: 10px;

            margin-top: 20px;
        }


        .action-btn {

            flex: 1;

            height: 46px;

            border-radius: 12px;

            text-decoration: none;

            display: flex;

            align-items: center;

            justify-content: center;

            font-size: 13px;

            font-weight: 600;

            transition: .25s;
        }


        .copy-btn {

            color: white;

            border: 1px solid rgba(0,200,255,.2);

            background: rgba(0,130,255,.1);
        }


        .translate-again {

            color: white;

            background:
                linear-gradient(
                    100deg,
                    #0969d7,
                    #00a9e8
                );
        }


        .action-btn:hover {

            transform: translateY(-2px);

        }


        .footer {

            text-align: center;

            color: #607992;

            font-size: 12px;

            margin-top: 18px;
        }


        @media(max-width:500px) {

            .app-container {
                padding-top: 25px;
            }

            .result-card {
                padding: 18px;
                border-radius: 20px;
            }

            .actions {
                flex-direction: column;
            }

        }

    </style>

</head>


<body>


<div class="app-container">


    <!-- BRAND -->

    <div class="brand">

        <!-- Replace with FOX animated image -->

        <div class="brand-icon">
            <img src="{{ url_for('static', filename='new.jpg') }}" alt="FOX AI" style="width:90%">
        
        </div>

        <h1>
             <span>AI Translate</span>
        </h1>

        <p>
            Your translation is ready.
        </p>

    </div>


    <!-- RESULT -->

    <div class="result-card">


        <div class="result-title">

            <h2>
                Translation Result
            </h2>

            <span class="badge-ai">
                ✨ FOX AI
            </span>

        </div>


        <!-- ORIGINAL -->

        <div class="language-label">
            Original
        </div>

        <div class="text-box original-box">

            {{ original }}

        </div>


        <!-- TRANSLATED -->

        <div class="language-label">
            Translated
        </div>

        <div class="text-box translated-box"
             id="translatedText">

            {{ output }}

        </div>


        <!-- ACTIONS -->

        <div class="actions">

            <button class="action-btn copy-btn"
                    onclick="copyTranslation()">

                📋 Copy Translation

            </button>


            <a href="/index"
               class="action-btn translate-again">

                ↻ Translate Again

            </a>

        </div>


    </div>


    <div class="footer">

         New College,Kolhapur
    </div>


</div>


<script>

function copyTranslation() {

    const text =
        document.getElementById("translatedText").innerText;

    navigator.clipboard.writeText(text);

    const button =
        document.querySelector(".copy-btn");

    button.innerHTML = "✓ Copied!";

    setTimeout(() => {

        button.innerHTML =
            "📋 Copy Translation";

    }, 1800);

}

</script>


</body>

</html>
